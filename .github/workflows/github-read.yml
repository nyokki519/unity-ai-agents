name: Read-only GitHub monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * *'
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: unity-github-read
  cancel-in-progress: false
jobs:
  monitor:
    if: ${{ vars.UNITY_FREE_ACTIONS_CONFIRMED == 'true' && github.event.repository.visibility == 'public' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read public repository metadata, issues and CI only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --use-env-proxy --import tsx src/cli.ts github-scan --summary
